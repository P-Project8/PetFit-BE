version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: petfit-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: petfit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: petfit-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: